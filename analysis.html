const TITANS = {
  Luci: {name:'Lucidious', BAT:0.810, bs:18, sp:7.5, ba:1, ap:2.0, bi:16, ip:6.0, bh:2000, bm:450, br:8.0, color:'luci'},
  Glac: {name:'Glacious',  BAT:0.961, bs:18, sp:7.0, ba:1, ap:2.0, bi:17, ip:9.0, bh:1900, bm:450, br:7.0, color:'glac'},
  Gran: {name:'Granitacles',BAT:1.150, bs:20, sp:9.0, ba:1, ap:2.0, bi:15, ip:6.0, bh:2000, bm:450, br:8.0, color:'gran'},
};
const TW = 1850, HF = 0.5, WA = 15, WH = 500, FT = 0.55;
const LVS = [3, 6, 8];
const TKS = ['Luci', 'Glac', 'Gran'];

// ══════════════════════════════════════════════
//  Precomputed stats
// ══════════════════════════════════════════════

function ca(lv) { let a = 6; for (let l = 3; l <= lv; l++) a += l % 2 === 1 ? 1 : 2; return a; }
function am(a) { return 1 / (1 + 0.06 * a); }
function st(tk, lv) {
  const t = TITANS[tk], g = lv - 1, s = t.bs + t.sp * g, a = t.ba + t.ap * g, i = t.bi + t.ip * g;
  return {
    hp: t.bh + s * 50, mana: t.bm + i * 20, armor: ca(lv), hpr: t.br + s * 0.1,
    aps: (1 + 0.008 * a) / t.BAT, bd: 130 + (lv - 2) * 10, bas: 0.008 * a, BAT: t.BAT, str: s
  };
}
const S = {};
TKS.forEach(tk => { S[tk] = {}; LVS.forEach(lv => { S[tk][lv] = st(tk, lv); }); });

// ══════════════════════════════════════════════
//  Core formulas
// ══════════════════════════════════════════════

function edps(arm, tfa, tfp) { return TW * HF * am(arm) * (1 - (tfa || 0) / 100) * (1 - (tfp || 0) / 100); }
function ttd(hp, ed, reg) { const n = ed - reg; return n > 0 ? hp / n : Infinity; }
function ehpCalc(hp, arm, tfa, tfp) { const m = HF * am(arm) * (1 - (tfa || 0) / 100) * (1 - (tfp || 0) / 100); return m > 0 ? hp / m : Infinity; }
function bwall(tk, lv) { const s = S[tk][lv]; return s.bd * FT * am(WA) * s.aps; }
function fmt(v, d) { if (!isFinite(v)) return '\u221e'; return d !== undefined ? v.toFixed(d) : Math.round(v * 10) / 10 + ''; }

// ══════════════════════════════════════════════
//  parseItemFields — extract editable fields
// ══════════════════════════════════════════════

function extractNum(desc, rx) { const m = desc.match(rx); return m ? parseFloat(m[1]) : 0; }

function parseItemFields(item) {
  const f = [];
  const stats = item.stats || [];
  stats.forEach(s => {
    const m = s.match(/([\d.]+)/);
    if (!m) return;
    const v = parseFloat(m[1]), sl = s.toLowerCase();
    if (/attack speed/i.test(s)) f.push({key:'as',label:'AS%',val:v,orig:v});
    else if (/hit point|^\+?\d+\s*h/i.test(s) && !/regen/i.test(s)) f.push({key:'hp',label:'HP',val:v,orig:v});
    else if (/mana point/i.test(s) && !/regen/i.test(s)) f.push({key:'mana',label:'Mana',val:v,orig:v});
    else if (/mana.*regen|mana regeneration/i.test(s)) f.push({key:'mreg',label:'MReg',val:v,orig:v});
    else if (/hp regen|health regen|hp regeneration/i.test(s)) f.push({key:'reg',label:'HReg',val:v,orig:v});
    else if (/damage/i.test(s) && !/reduction|structure/i.test(s)) f.push({key:'ad',label:'AD',val:v,orig:v});
    else if (/armor/i.test(s)) f.push({key:'armor',label:'Armor',val:v,orig:v});
    else if (/vitality/i.test(s)) f.push({key:'vit',label:'VIT',val:v,orig:v});
  });
  // Parse passives
  (item.passives || []).forEach(p => {
    const d = p.description || '', n = p.name || '';
    if (/tidal fortitude/i.test(n)) {
      const arm = extractNum(d, /\+(\d+)\s*armor/i);
      if (arm) f.push({key:'tf_arm',label:'TF +arm',val:arm,orig:arm});
      const red = extractNum(d, /(\d+)%/i);
      if (red) {
        const isPhys = /physical/i.test(d);
        f.push({key:'tf_red',label:'TF red%',val:red,orig:red, note: isPhys ? 'phys' : 'all'});
      }
    }
    if (/crisis regen/i.test(n)) {
      f.push({key:'crisis',label:'Crisis',val:1,orig:1,readonly:true});
    }
    if (/runic mark|runic exposure/i.test(n)) {
      const v = extractNum(d, /(\d+)\s*(?:bonus\s+)?magic damage/i) || extractNum(d, /deals\s+(\d+)/i);
      if (v) f.push({key:'runic',label:'Runic dmg',val:v,orig:v});
    }
    if (/structure crush/i.test(n)) {
      const base = extractNum(d, /deal\s+(\d+)/i);
      const plv = extractNum(d, /(\d+)\s*\u00d7\s*Level/i) || extractNum(d, /(\d+).*level/i);
      const cap = extractNum(d, /maximum.*?(\d+)/i);
      if (base) f.push({key:'crush_b',label:'Crush base',val:base,orig:base});
      if (plv) f.push({key:'crush_plv',label:'Crush/lv',val:plv,orig:plv});
      if (cap) f.push({key:'crush_cap',label:'Crush cap',val:cap,orig:cap});
    }
    if (/titan$/i.test(n)) {
      const base = extractNum(d, /deal\s+(\d+)/i);
      const plv = extractNum(d, /(\d+)\s*\u00d7/i) || extractNum(d, /\((\d+)/i);
      if (base) f.push({key:'crush_b',label:'Titan base',val:base,orig:base});
      if (plv) f.push({key:'crush_plv',label:'Titan/lv',val:plv,orig:plv});
      f.push({key:'crush_cap',label:'Titan cap',val:999,orig:999});
    }
    if (/structure burn|fiery touch/i.test(n)) {
      const pct = extractNum(d, /([\d.]+)%/i);
      const flat = extractNum(d, /\+\s*(\d+)\s*damage/i) || extractNum(d, /(\d+)\s*damage per/i);
      if (pct) f.push({key:'burn_pct',label:'Burn %HP',val:pct,orig:pct});
      if (flat) f.push({key:'burn_flat',label:'Burn flat',val:flat,orig:flat});
    }
    if (/voodoo decay/i.test(n)) {
      const v = extractNum(d, /(\d+)/i);
      if (v) f.push({key:'voo_arm',label:'Voo -arm',val:v,orig:v});
    }
    if (/runic wrath/i.test(n)) {
      const pct = extractNum(d, /(\d+)%\s*max mana/i);
      if (pct) f.push({key:'rw_pct',label:'RW %mana',val:pct,orig:pct});
      const spell = extractNum(d, /additional\s*(\d+)%/i);
      if (spell) f.push({key:'rw_spell',label:'RW spell+%',val:spell,orig:spell});
    }
    if (/colossus/i.test(n)) {
      const v = extractNum(d, /([\d.]+)%/i);
      if (v) f.push({key:'col_pct',label:'Colossus%',val:v,orig:v});
    }
    if (/smash/i.test(n)) {
      const v = extractNum(d, /([\d.]+)%/i);
      if (v) f.push({key:'smash_pct',label:'Smash%',val:v,orig:v});
    }
    if (/^fervor$/i.test(n)) {
      const stacks = extractNum(d, /up to (\d+) times/i);
      const maxas = extractNum(d, /(\d+)%\s*bonus/i);
      if (maxas) f.push({key:'ferv_max',label:'Fervor AS%',val:maxas,orig:maxas});
      if (stacks) f.push({key:'ferv_stacks',label:'Ferv stacks',val:stacks,orig:stacks});
    }
    if (/healing amplification/i.test(n)) {
      f.push({key:'heal_amp',label:'Heal Amp%',val:extractNum(d,/(\d+)%/i),orig:extractNum(d,/(\d+)%/i)});
    }
    if (/magic resist/i.test(n)) {
      f.push({key:'mdr',label:'MDR%',val:extractNum(d,/(\d+)%/i),orig:extractNum(d,/(\d+)%/i)});
    }
    if (/unstable magic/i.test(n)) {
      const v = extractNum(d, /(\d+)/i);
      f.push({key:'aura_reg',label:'Aura HP/s',val:v,orig:v});
    }
    if (/tidal aura/i.test(n)) {
      const v = extractNum(d, /(\d+)\s*hit point/i) || extractNum(d, /(\d+)\s*mana/i) || 5;
      f.push({key:'aura_reg',label:'Aura HP/s',val:v,orig:v});
    }
  });
  // Active heals
  if (item.active) {
    const ad = item.active.description || '';
    if (/war shout/i.test(item.active.name)) {
      f.push({key:'shout_pct',label:'Shout AD%',val:extractNum(ad,/(\d+)%/i),orig:extractNum(ad,/(\d+)%/i)});
      f.push({key:'shout_dur',label:'Shout dur',val:extractNum(ad,/(\d+)\s*second/i),orig:extractNum(ad,/(\d+)\s*second/i)});
      const cd = parseFloat(item.active.cooldown) || 30;
      f.push({key:'shout_cd',label:'Shout cd',val:cd,orig:cd});
    }
    if (/unleashed rage/i.test(item.active.name)) {
      f.push({key:'rage_pct',label:'Rage AD%',val:extractNum(ad,/(\d+)%/i),orig:extractNum(ad,/(\d+)%/i)});
      f.push({key:'rage_dur',label:'Rage dur',val:extractNum(ad,/(\d+)\s*second/i),orig:extractNum(ad,/(\d+)\s*second/i)});
      const cd = parseFloat(item.active.cooldown) || 30;
      f.push({key:'rage_cd',label:'Rage cd',val:cd,orig:cd});
    }
    if (/war cry/i.test(item.active.name)) {
      f.push({key:'warcry_dur',label:'WCry dur',val:extractNum(ad,/(\d+)\s*second/i),orig:extractNum(ad,/(\d+)\s*second/i)});
      const cd = parseFloat(item.active.cooldown) || 60;
      f.push({key:'warcry_cd',label:'WCry cd',val:cd,orig:cd});
    }
    if (/bond|call of valor/i.test(item.active.name)) {
      const share = extractNum(ad,/(\d+)%/i);
      const arm = extractNum(ad,/(\d+)\s*(?:bonus\s+)?armor/i);
      const dur = extractNum(ad,/(\d+(?:\.\d+)?)\s*second/i);
      const cd = parseFloat(item.active.cooldown) || 60;
      f.push({key:'bond_share',label:'Bond share%',val:share,orig:share});
      f.push({key:'bond_arm',label:'Bond +arm',val:arm,orig:arm});
      f.push({key:'bond_dur',label:'Bond dur',val:dur,orig:dur});
      f.push({key:'bond_cd',label:'Bond cd',val:cd,orig:cd});
      if (/regenerate (\d+)/i.test(ad)) {
        f.push({key:'bond_reg',label:'Bond reg/s',val:extractNum(ad,/regenerate (\d+)/i),orig:extractNum(ad,/regenerate (\d+)/i)});
      }
    }
    if (/abysmal drink/i.test(item.active.name)) {
      const heal = extractNum(ad,/(\d+)\s*hit point/i) || extractNum(ad,/replenishes (\d+)/i) || 300;
      const cd = parseFloat(item.active.cooldown) || 60;
      f.push({key:'active_heal',label:'Heal HP',val:heal,orig:heal});
      f.push({key:'active_heal_cd',label:'Heal cd',val:cd,orig:cd});
    }
  }
  return f;
}

// ══════════════════════════════════════════════
//  computeDef / computeOff
// ══════════════════════════════════════════════

function computeDef(fields, tk, lv) {
  const s = S[tk][lv];
  const g = k => { const f = fields.find(x => x.key === k); return f ? f.val : 0; };
  const hp = g('hp'), armor = g('armor') + g('tf_arm'), reg = g('reg') + g('aura_reg');
  const tfa = g('tf_red') && fields.find(f => f.key === 'tf_red')?.note !== 'phys' ? g('tf_red') : 0;
  const tfp = g('tf_red') && fields.find(f => f.key === 'tf_red')?.note === 'phys' ? g('tf_red') : 0;
  const crisis = g('crisis');
  const heal_hps = g('active_heal') && g('active_heal_cd') ? g('active_heal') / g('active_heal_cd') : 0;

  const e0 = edps(s.armor);
  const t0 = ttd(s.hp, e0, s.hpr);
  const ehp0 = ehpCalc(s.hp, s.armor);

  // Passive
  let t1, ehp1;
  const totalReg = s.hpr + reg + heal_hps;
  if (crisis) {
    const e1 = edps(s.armor + armor, tfa, tfp);
    const hpt = s.hp + hp;
    const n1 = e1 - (s.hpr + reg + heal_hps);
    const n2 = e1 - (s.hpr + reg * 2 + heal_hps);
    t1 = (n1 > 0 && n2 > 0) ? (hpt * .5) / n1 + (hpt * .5) / n2 : Infinity;
  } else {
    const e1 = edps(s.armor + armor, tfa, tfp);
    t1 = ttd(s.hp + hp, e1, totalReg);
  }
  ehp1 = ehpCalc(s.hp + hp, s.armor + armor, tfa, tfp);

  // Bond active (if applicable)
  let t_bond = null, ehp_bond = null;
  if (g('bond_share') > 0) {
    const ba = s.armor + armor + g('bond_arm');
    const share = g('bond_share') / 100;
    const e_bond = TW * HF * am(ba) * (1 - share) * (1 - tfa / 100) * (1 - tfp / 100);
    const bond_reg = g('bond_reg') || 0;
    t_bond = ttd(s.hp + hp, e_bond, s.hpr + reg + heal_hps + bond_reg);
    ehp_bond = (s.hp + hp) / ((1 - share) * am(ba) * HF * (1 - tfa / 100) * (1 - tfp / 100));
  }

  return { dt: t1 - t0, ehp: ehp1, ehp0, dt_bond: t_bond !== null ? t_bond - t0 : null, ehp_bond };
}

function computeOff(fields, tk, lv) {
  const s = S[tk][lv];
  const g = k => { const f = fields.find(x => x.key === k); return f ? f.val : 0; };
  const bw = bwall(tk, lv);

  const ad = g('ad'), as_pct = g('as'), mana_x = g('mana');
  const runic = g('runic'), crush_b = g('crush_b'), crush_plv = g('crush_plv'), crush_cap = g('crush_cap');
  const burn_pct = g('burn_pct'), burn_flat = g('burn_flat');
  const rw_pct = g('rw_pct'), rw_spell = g('rw_spell');
  const col_pct = g('col_pct'), hp_x = g('hp');
  const voo_arm = g('voo_arm');
  const ferv_max = g('ferv_max');

  // Shout/Rage/WarCry
  const shout_pct = g('shout_pct'), shout_dur = g('shout_dur'), shout_cd = g('shout_cd');
  const rage_pct = g('rage_pct'), rage_dur = g('rage_dur'), rage_cd = g('rage_cd');
  const warcry_dur = g('warcry_dur'), warcry_cd = g('warcry_cd');

  function calc(shout_up, rage_up, warcry_up, ferv_frac, rw_mult, useVoo) {
    const thp = s.hp + hp_x;
    const tm = s.mana + mana_x;
    let iad = ad;
    if (shout_pct > 0) iad += s.bd * shout_pct / 100 * shout_up;
    if (rage_pct > 0) iad += s.bd * rage_pct / 100 * rage_up;
    let wcc = 0;
    if (warcry_up > 0 && col_pct > 0) { iad += thp * 0.05 * warcry_up; wcc = (col_pct / 100) * thp * warcry_up; }
    const tad = s.bd + iad;
    const cdmg = col_pct > 0 ? (col_pct / 100) * thp : 0;
    const ead = tad + cdmg + wcc;
    const fas = s.bas + as_pct / 100;
    const afv = ferv_max > 0 ? ferv_max / 100 * ferv_frac : 0;
    const taps = (1 + fas + afv) / s.BAT;
    const ewa = Math.max(WA - (useVoo ? voo_arm : 0), 0);
    const ph = ead * FT * am(ewa);
    const cr = crush_cap > 0 ? Math.min(crush_b + crush_plv * lv, crush_cap) : 0;
    const mg = runic > 0 ? runic / 2 : 0;
    const rw = rw_pct > 0 ? (rw_pct / 100) * tm * rw_mult : 0;
    return (ph + cr + mg + rw) * taps + (burn_pct / 100) * WH + burn_flat;
  }

  const shout_avg = shout_cd > 0 ? shout_dur / shout_cd : 0;
  const rage_avg = rage_cd > 0 ? rage_dur / rage_cd : 0;
  const warcry_avg = warcry_cd > 0 ? warcry_dur / warcry_cd : 0;
  const rw_spell_mult = rw_spell > 0 ? 1 + rw_spell / 100 : 1;

  // Passive (no buffs, no ward)
  const wall_passive = calc(0, 0, 0, 0, 1, false) - bw;
  // Avg (averaged active uptime, ward assumed up)
  const wall_avg = calc(shout_avg, rage_avg, warcry_avg, 0.7, 1, true) - bw;
  // Active (full buffs, ward up, spell buff)
  const wall_active = calc(1, 1, 1, 1, rw_spell_mult, true) - bw;

  return {
    wall_passive, wall_avg, wall_active,
    has_active: (shout_pct > 0 || rage_pct > 0 || warcry_dur > 0 || ferv_max > 0 || rw_spell > 0 || voo_arm > 0)
  };
}

// ══════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════

let categories = {};
let currentCat = 't1d';
let activeLvByCat = {};  // Track active level per category

function initCategories() {
  const catItems = {
    t1d: ["reef-shield", "regenerative-spines", "tides-heart"],
    t2d: ["reef-armor", "super-regenerative-spines", "heart-of-the-sea", "casque-of-valor", "caster-scroll", "enchantress-fluid", "magic-armor", "eternal-wards"],
    t2o: ["blasting-wand", "voodoo-doll", "gauntlets-of-embers", "runic-axe", "titanic-tridents", "warbanner", "berserkers-gem"],
    t3d: ["mystic-staff-of-gods", "mace-of-mortality", "essence-of-pure-magic", "armor-of-tides", "robe-of-spellcraft", "dawnkeeper", "enchanted-druid-leaf", "enchanted-magic-armor", "mistlords-cape", "ankh-of-superiority"],
    t3o: ["tidal-scepter", "highseer-slippers", "foretellers-sickle", "helmet-of-the-damned", "molten-blade", "poseidons-trident", "spear-of-fervor"],
  };
  for (const [cat, ids] of Object.entries(catItems)) {
    categories[cat] = ids.map(id => {
      const item = V5[id];
      if (!item) return null;
      return { id, name: item.name, cost: item.totalCost, fields: parseItemFields(item) };
    }).filter(Boolean);
    activeLvByCat[cat] = 3;
  }
}

// ══════════════════════════════════════════════
//  Render: Item Cards (into #itemEditor)
// ══════════════════════════════════════════════

function renderItemCards(cat) {
  const items = categories[cat];
  let h = '<div class="item-strip"><table><tbody>';
  items.forEach((item, idx) => {
    const editableFields = item.fields.filter(f => !f.readonly);
    if (editableFields.length === 0) return;
    // Item name row
    h += '<tr><td>' + item.name + ' <span style="color:#fbbf24;font-size:11px;font-weight:400">(' + item.cost + 'g)</span></td>';
    // Each field as a cell in the same row
    editableFields.forEach((f, fi) => {
      const realFi = item.fields.indexOf(f);
      const changed = f.val !== f.orig ? ' changed' : '';
      h += '<td style="font-size:12px;color:var(--text-muted)">' + f.label + ' ';
      h += '<input type="number" step="any" value="' + f.val + '" class="' + changed + '"';
      h += ' data-cat="' + cat + '" data-idx="' + idx + '" data-fi="' + realFi + '"';
      h += ' onchange="onFieldChange(this)" oninput="onFieldChange(this)">';
      h += '<span class="orig">(' + f.orig + ')</span></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

// ══════════════════════════════════════════════
//  Render: Result Table (into #resultTables)
// ══════════════════════════════════════════════

function renderResultTable(cat, lv) {
  const items = categories[cat];
  const isDef = cat.endsWith('d');
  const colsPerTitan = isDef ? 2 : 1;

  let h = '<div class="res-wrap"><table class="res-tbl"><thead>';
  // Top row: titan names
  h += '<tr><th rowspan="2" style="text-align:left">Item</th><th rowspan="2" title="Total item cost including all components">Gold</th>';
  TKS.forEach(tk => {
    const t = TITANS[tk];
    h += '<th colspan="' + colsPerTitan + '" class="col-' + t.color + '" style="text-align:center;font-size:13px">' + t.name + '</th>';
  });
  if (isDef) {
    h += '<th rowspan="2" title="Average \u0394TTD across all titans">Avg</th>';
    h += '<th rowspan="2" title="Average \u0394TTD per gold spent">/gold</th>';
  } else {
    h += '<th rowspan="2" title="Average wall DPS across all titans">Avg</th>';
    h += '<th rowspan="2" title="Average wall DPS per gold spent">/gold</th>';
  }
  h += '</tr>';

  // Sub row: metric labels
  h += '<tr>';
  TKS.forEach(tk => {
    const c = TITANS[tk].color;
    if (isDef) {
      h += '<th class="col-' + c + '" title="Extra seconds alive vs 36 super towers (1850 DPS ranged) compared to no items">\u0394TTD</th>';
      h += '<th class="col-' + c + '" title="Effective HP = raw HP \u00f7 damage multiplier (accounts for armor and damage reduction)">EHP</th>';
    } else {
      h += '<th class="col-' + c + '" title="Wall DPS with item passive stats only">\u0394 Wall DPS</th>';
    }
  });
  h += '</tr></thead><tbody>';

  let allDpg = [];
  let rows = [];
  items.forEach(item => {
    const row = { name: item.name, cost: item.cost, vals: [] };
    if (isDef) {
      let sum = 0, cnt = 0;
      TKS.forEach(tk => {
        const r = computeDef(item.fields, tk, lv);
        row.vals.push(r);
        if (isFinite(r.dt)) { sum += r.dt; cnt++; }
      });
      row.avg = cnt > 0 ? sum / cnt : Infinity;
      row.dpg = isFinite(row.avg) ? row.avg / item.cost : Infinity;
    } else {
      let sum = 0;
      TKS.forEach(tk => {
        const r = computeOff(item.fields, tk, lv);
        row.vals.push(r);
        sum += r.wall_avg;
      });
      row.avg = sum / TKS.length;
      row.dpg = row.avg / item.cost;
    }
    allDpg.push(row.dpg);
    rows.push(row);
  });

  const bestDpg = Math.max(...allDpg.filter(v => isFinite(v) && v > 0));
  rows.forEach(row => {
    const bestCls = Math.abs(row.dpg - bestDpg) < 0.0001 ? ' class="best-cell"' : '';
    h += '<tr><td>' + row.name + '</td><td class="gold">' + row.cost + '</td>';
    if (isDef) {
      row.vals.forEach((r, i) => {
        const c = TITANS[TKS[i]].color;
        h += '<td class="col-' + c + '">' + fmt(r.dt, 2) + '</td>';
        h += '<td class="col-' + c + '">' + fmt(r.ehp, 0) + '</td>';
      });
      h += '<td>' + fmt(row.avg, 2) + '</td>';
      h += '<td' + (bestDpg > 0 ? bestCls : '') + '>' + fmt(row.dpg, 4) + '</td>';
      h += '</tr>';
      // Sub-row for Bond / Call of Valor active
      const hasBond = row.vals.some(r => r.dt_bond !== null);
      if (hasBond) {
        const bondName = row.name.includes('Dawnkeeper') ? 'Call of Valor' : 'Bond';
        const bondAvg = row.vals.reduce((s, r) => s + (r.dt_bond || 0), 0) / TKS.length;
        h += '<tr class="sub-row"><td>\u21b3 ' + bondName + ' active</td><td></td>';
        row.vals.forEach((r, i) => {
          const c = TITANS[TKS[i]].color;
          h += '<td class="col-' + c + '" style="color:#4ade80">' + (r.dt_bond !== null ? fmt(r.dt_bond, 2) : '\u2014') + '</td>';
          h += '<td class="col-' + c + '" style="color:#4ade80">' + (r.ehp_bond !== null ? fmt(r.ehp_bond, 0) : '\u2014') + '</td>';
        });
        h += '<td style="color:#4ade80">' + fmt(bondAvg, 2) + '</td>';
        h += '<td></td>';
        h += '</tr>';
      } else {
        // No sub-row needed
      }
    } else {
      // Main row: passive wall DPS
      row.vals.forEach((r, i) => {
        const c = TITANS[TKS[i]].color;
        h += '<td class="col-' + c + '">' + fmt(r.wall_passive, 1) + '</td>';
      });
      const passiveAvg = row.vals.reduce((s,r) => s + r.wall_passive, 0) / TKS.length;
      h += '<td>' + fmt(passiveAvg, 1) + '</td>';
      h += '<td' + (bestDpg > 0 ? bestCls : '') + '>' + fmt(row.dpg, 4) + '</td>';
      h += '</tr>';
      // Sub-row: buffed wall DPS (only if item has actives)
      if (row.vals[0].has_active) {
        const buffAvg = row.vals.reduce((s,r) => s + r.wall_active, 0) / TKS.length;
        h += '<tr class="sub-row"><td>\u21b3 Buffs active</td><td></td>';
        row.vals.forEach((r, i) => {
          const c = TITANS[TKS[i]].color;
          h += '<td class="col-' + c + '" style="color:#4ade80">' + fmt(r.wall_active, 1) + '</td>';
        });
        h += '<td style="color:#4ade80">' + fmt(buffAvg, 1) + '</td><td></td></tr>';
      }
    }
  });
  h += '</tbody></table></div>';
  return h;
}

// ══════════════════════════════════════════════
//  Render: Tables section (level tabs + tables)
// ══════════════════════════════════════════════

function renderTables(cat) {
  const activeLv = activeLvByCat[cat] || 3;
  let h = '';

  // Level tabs
  h += '<div class="lv-tabs">';
  LVS.forEach(lv => {
    const act = lv === activeLv ? ' active' : '';
    h += '<button class="lv-btn' + act + '" data-lv="' + lv + '" onclick="showLv(\'' + cat + '\',' + lv + ',this)">Lv' + lv + '</button>';
  });
  h += '</div>';

  // Level panels
  LVS.forEach(lv => {
    const act = lv === activeLv ? ' active' : '';
    h += '<div id="' + cat + '-lv' + lv + '" class="lv-panel' + act + '">';
    h += renderResultTable(cat, lv);
    h += '</div>';
  });

  return h;
}

// ══════════════════════════════════════════════
//  UI Actions
// ══════════════════════════════════════════════

function showCat(cat) {
  currentCat = cat;

  // Update category tab active states
  document.querySelectorAll('#catTabs button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('#catTabs button[onclick*="' + cat + '"]');
  if (btn) btn.classList.add('active');

  // Render item cards into #itemEditor
  document.getElementById('itemEditor').innerHTML = renderItemCards(cat);

  // Render tables into #resultTables
  document.getElementById('resultTables').innerHTML = renderTables(cat);
}

function showLv(cat, lv, btn) {
  activeLvByCat[cat] = lv;

  // Toggle level panel visibility
  document.querySelectorAll('#resultTables .lv-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('#resultTables .lv-tabs button').forEach(b => b.classList.remove('active'));

  const panel = document.getElementById(cat + '-lv' + lv);
  if (panel) panel.classList.add('active');
  if (btn) btn.classList.add('active');
}

function onFieldChange(input) {
  const cat = input.dataset.cat;
  const idx = parseInt(input.dataset.idx);
  const fi = parseInt(input.dataset.fi);
  const field = categories[cat][idx].fields[fi];

  // Update data
  field.val = parseFloat(input.value) || 0;

  // Update changed visual on the input (do NOT re-render cards)
  input.classList.toggle('changed', field.val !== field.orig);

  // Re-render ONLY the tables section, preserving active level
  document.getElementById('resultTables').innerHTML = renderTables(cat);
}

// ══════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════

initCategories();
showCat('t1d');
</script>
